<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <style>
        body { margin:0; padding:0; overflow:hidden; background:#1e1e1e; }
        #container { width:100%; height:100vh; }
    </style>
    <link rel="stylesheet" data-name="vs/editor/editor.main" href="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.44.0/min/vs/editor/editor.main.css">
</head>
<body>
    <div id="container"></div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.44.0/min/vs/loader.js"></script>
    <script>
        require.config({ paths: { vs: 'https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.44.0/min/vs' } });
        require(['vs/editor/editor.main'], function () {
            window.editor = monaco.editor.create(document.getElementById('container'), {
                value: '',
                language: 'lua',
                theme: 'vs-dark',
                automaticLayout: true,
                minimap: { enabled: false },
                fontSize: 14,
                fontFamily: 'Consolas, monospace',
                lineNumbers: 'on',
                roundedSelection: false,
                scrollBeyondLastLine: false,
                wordWrap: 'off',
                tabSize: 4,
                insertSpaces: true,
                automaticBracketsClosing: true,
                autoIndent: 'advanced',
                padding: { top: 8 }
            });

            window.editor.getValue = function() { return window.editor.getValue(); };
            window.editor.setValue = function(v) { window.editor.setValue(v); };

            window.applyEditorColors = function(bgColor, lineHighlight, lineHighlightBorder) {
                monaco.editor.defineTheme('potassium', {
                    base: 'vs-dark',
                    inherit: true,
                    rules: [],
                    colors: {
                        'editor.background': bgColor || '#1e1e1e',
                        'editor.lineHighlightBackground': lineHighlight || '#00000000',
                        'editor.lineHighlightBorder': lineHighlightBorder || '#00000000'
                    }
                });
                monaco.editor.setTheme('potassium');
            };

            window.updateEditorOptions = function(options) {
                try {
                    var opts = JSON.parse(options);
                    window.editor.updateOptions(opts);
                } catch(e) {}
            };

            if (window.onEditorReady) window.onEditorReady();
        });
    </script>
</body>
</html>
